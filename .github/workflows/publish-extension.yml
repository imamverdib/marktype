name: Publish Extension to Open VSX

on:
  push:
    branches:
      - main
    paths:
      - 'extension/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare extension version
        run: node scripts/prepare-extension-version.mjs

      - name: Commit version bump if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet extension/package.json; then
            NEW_VERSION=$(node -p "require('./extension/package.json').version")
            git add extension/package.json
            git commit -m "chore(release): bump extension version to $NEW_VERSION [skip ci]"
            git push origin main
          fi

      - name: Build and package extension
        run: npm run ext:package

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          npx ovsx publish extension/marktype-*.vsix -p "$OVSX_PAT"
