[package]
name = "marktype"
version = "0.1.0"
description = "MarkType — a fast, minimalist Typora-inspired Markdown editor"
authors = ["Behbudlu"]
edition = "2021"
rust-version = "1.77.2"

# The `_lib` suffix avoids a name collision with the binary on some platforms.
[lib]
name = "marktype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
